<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zunix Student Access — Sign In or Create Account</title>
  <link rel="icon" href="../src/img/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="../src/img/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="../src/img/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../src/styles/theme.css" />
  <link rel="stylesheet" href="../src/styles/AccessPage.css" />
</head>
<body class="access-body">

  <!-- Fixed Minimal Navigation Header -->
  <header class="auth-top-header">
    <a href="../index.html" class="auth-brand">
      <img src="../src/img/favicon-32x32.png" alt="Zunix Logo" />
      <span>Zunix</span>
    </a>
    <div class="auth-top-nav">
      <a href="../index.html" class="auth-home-link">
        <i class="fas fa-arrow-left"></i> Return Home
      </a>
      <button class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">
        <span class="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- Focused Centered Authentication Card -->
  <main class="auth-page-wrapper">
    <div class="auth-card access-container">

      <!-- Card Header -->
      <div class="auth-header">
        <div class="auth-logo-badge">
          <img src="../src/img/favicon-32x32.png" alt="Zunix" />
        </div>
        <h1 class="auth-title" id="authTitle">Welcome to Zunix</h1>
        <p class="auth-subtitle" id="authSubtitle">Sign in to access your campus hub & rewards</p>
      </div>

      <!-- Segmented Tab Switcher -->
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true" onclick="showLogin()">
          Sign In
        </button>
        <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false" onclick="showSignup()">
          Create Account
        </button>
      </div>

      <!-- Fast Google OAuth -->
      <button class="google-btn" type="button" onclick="googleAuthHandler()">
        <img src="../src/img/google.png" alt="Google logo" />
        <span>Continue with Google</span>
      </button>

      <!-- Clean Divider -->
      <div class="demacate">
        <span>or continue with email</span>
      </div>

      <!-- SIGN IN FORM -->
      <div class="form-box active" id="loginBox" aria-labelledby="tabLogin">
        <div id="signInMessage" class="messageDiv" style="display:none;"></div>
        
        <form class="login-form" id="loginForm" action="#" method="POST" onsubmit="return handleLogin(event)">
          <div class="input-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-field-wrap">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required autocomplete="email" />
            </div>
          </div>

          <div class="input-group">
            <div class="label-row">
              <label for="loginPassword">Password</label>
              <a href="#" class="forgot-link" onclick="alert('Password reset link will be sent to your registered student email address.')">Forgot?</a>
            </div>
            <div class="input-field-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required autocomplete="current-password" />
            </div>
          </div>

          <div class="remember-row">
            <label class="checkbox-label" for="remember">
              <input type="checkbox" id="remember" name="remember" />
              <span>Remember this device</span>
            </label>
          </div>

          <button type="submit" class="access-button">
            Sign In to Hub
          </button>
        </form>

        <p class="switch-mode-text">
          Don't have an account yet? <a href="#" onclick="showSignup()">Create an account</a>
        </p>
      </div>

      <!-- SIGN UP FORM -->
      <div class="form-box" id="signupBox" aria-labelledby="tabSignup">
        <div id="signUpMessage" class="messageDiv" style="display:none;"></div>

        <form id="signupForm" action="#" method="POST" onsubmit="return validateForm(event)">
          <div class="input-group">
            <label for="signupFullName">Full Name</label>
            <div class="input-field-wrap">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="signupFullName" name="fullName" placeholder="e.g. David Stark" required autocomplete="name" />
            </div>
          </div>

          <div class="input-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-field-wrap">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="signupEmail" name="email" placeholder="student@university.edu" required autocomplete="email" />
            </div>
          </div>

          <div class="input-group">
            <label for="signupPassword">Password</label>
            <div class="input-field-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="signupPassword" name="password" placeholder="Min. 6 chars with number/special" required autocomplete="new-password" />
            </div>
          </div>

          <div class="input-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <div class="input-field-wrap">
              <i class="fas fa-shield-alt input-icon"></i>
              <input type="password" id="signupConfirmPassword" name="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password" />
            </div>
          </div>

          <p id="error-msg" class="error-msg" style="display:none;"></p>

          <button type="submit" class="access-button">
            Create Free Account
          </button>
        </form>

        <p class="switch-mode-text">
          Already have an account? <a href="#" onclick="showLogin()">Sign In</a>
        </p>
      </div>

      <!-- Card Trust Security Footer -->
      <div class="auth-card-footer">
        <i class="fas fa-shield-halved"></i> 256-bit encrypted student portal
      </div>

    </div>
  </main>

  <!-- Interactive Scripts -->
  <script>
    function showLogin() {
      document.getElementById("signupBox").classList.remove("active");
      document.getElementById("loginBox").classList.add("active");
      document.getElementById("tabLogin").classList.add("active");
      document.getElementById("tabSignup").classList.remove("active");
      document.getElementById("tabLogin").setAttribute("aria-selected", "true");
      document.getElementById("tabSignup").setAttribute("aria-selected", "false");
      
      const title = document.getElementById("authTitle");
      const sub = document.getElementById("authSubtitle");
      if (title) title.textContent = "Welcome to Zunix";
      if (sub) sub.textContent = "Sign in to access your campus hub & rewards";
      
      if (history.replaceState) history.replaceState(null, "", "#loginBox");
    }

    function showSignup() {
      document.getElementById("loginBox").classList.remove("active");
      document.getElementById("signupBox").classList.add("active");
      document.getElementById("tabSignup").classList.add("active");
      document.getElementById("tabLogin").classList.remove("active");
      document.getElementById("tabSignup").setAttribute("aria-selected", "true");
      document.getElementById("tabLogin").setAttribute("aria-selected", "false");
      
      const title = document.getElementById("authTitle");
      const sub = document.getElementById("authSubtitle");
      if (title) title.textContent = "Create Student Account";
      if (sub) sub.textContent = "Join 10,000+ students across top campuses";
      
      if (history.replaceState) history.replaceState(null, "", "#signupBox");
    }

    function googleAuthHandler() {
      const activeIsSignup = document.getElementById("signupBox").classList.contains("active");
      if (activeIsSignup && typeof window.googleSignUp === "function") {
        window.googleSignUp();
      } else if (typeof window.googleSignIn === "function") {
        window.googleSignIn();
      } else {
        alert("Google authentication initializing. Please continue with email.");
      }
    }

    function showMessage(message, divId, isGood = false) {
      const div = document.getElementById(divId);
      if (!div) return;
      div.style.display = "block";
      div.innerHTML = message;
      div.style.opacity = "1";
      if (isGood) {
        div.style.borderColor = "var(--accent-emerald, #00ff99)";
        div.style.color = "var(--accent-emerald, #00ff99)";
      } else {
        div.style.borderColor = "#ff4d4d";
        div.style.color = "#ff4d4d";
      }
      setTimeout(() => {
        div.style.transition = "opacity 0.4s ease";
        div.style.opacity = "0";
        setTimeout(() => div.style.display = "none", 400);
      }, 5000);
    }

    function isPasswordStrong(password) {
      const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*()_+{}:;<>,.?/~`-])/;
      return password.length >= 6 && passwordRegex.test(password);
    }

    window.showMessage = showMessage;
    window.isPasswordStrong = isPasswordStrong;

    // Read URL hash on load (e.g. #signupBox or #loginBox)
    window.addEventListener("DOMContentLoaded", () => {
      if (window.location.hash === "#signupBox") {
        showSignup();
      } else {
        showLogin();
      }
    });
  </script>

  <script type="module" src="../src/js/theme.js"></script>
  <script type="module" src="../src/js/i18n.js"></script>
  <script type="module" src="../src/js/auth.js"></script>
</body>
</html>
